# Updates the maven version and checks in
# ---
# Add the following GitHub secrets from your Secret Manager
# - PERSONAL_GITHUB_TOKEN: personal GitHub token

name: Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (empty for SNAPSHOT/next patch)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
      - name: Set up JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: latest
      - name: Commit version change
        id: set_version
        uses: ./.github/actions/version
        with:
          version: ${{ inputs.version }}
      - name: Push commit
        run: |
          git push origin HEAD -f
