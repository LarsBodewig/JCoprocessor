# Builds the project with Maven Wrapper using the 'release' profile and publishes to Maven Central
# ---
# Add the following GitHub secrets from your Secret Manager
# - MAVEN_USERNAME:        your Sonatype username
# - MAVEN_CENTRAL_TOKEN:   an Access Token generated in your Sonatype profile
# - MAVEN_GPG_PASSPHRASE:  your GPG passphrase
# - MAVEN_GPG_PRIVATE_KEY: your GPG private key
# - PERSONAL_GITHUB_TOKEN: personal GitHub token

name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
      - name: Set up JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: latest
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Remove snapshot version
        id: remove_snapshot
        uses: ./.github/actions/version
      - name: Publish to Apache Maven Central
        run: |
          ./mvnw clean deploy -B -P release
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Set tag
        run: |
          git tag -a -f -m "v${{ steps.remove_snapshot.outputs.newVersion }}" \
            "v${{ steps.remove_snapshot.outputs.newVersion }}"
      - name: Set next snapshot version
        id: next_snapshot
        uses: ./.github/actions/version
      - name: Push commits and tag
        run: |
          git push origin "v${{ steps.remove_snapshot.outputs.newVersion }}" -f
          git push origin HEAD -f
